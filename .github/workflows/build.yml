name: Gerar APK Pygame
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.33 setuptools==65.5.0

      - name: Configurar e Compilar APK
        run: |
          buildozer init
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,json/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame/g' buildozer.spec
          yes | buildozer android debug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuRPG-APK
          path: bin/*.apk
          
